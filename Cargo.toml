[package]
name = "doit-tui"
version = "0.1.4"
edition = "2024"
description = "doit 待办应用终端版（ratatui）"

# 终端快捷启动指令：`doit`（主命令，与三端命名统一）。
[[bin]]
name = "doit"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs = "5"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
